# Where the monthly routine reads each month-end NAV, in order of preference.
# The routine stops at the first source that gives a value dated on the month's last
# NAV date (within 7 days of the month end). If none does, it writes nothing, logs the
# failure in private-data/log/ and alerts the owner.
#
# Source kinds:
#   official_file    manager's downloadable NAV history (daily)
#   official_page    manager's fund page (latest NAV with date)
#   factsheet        manager's monthly factsheet (month-end NAV or monthly return), published ~5-15 days after month end
#   factsheet_mirror the manager's own factsheet hosted by a distributor (Finanzfluss, ING, Allfunds...)
#   crosscheck       third-party page used only to cross-check the amount, never as the source of the date
#   manual           the owner drops the PDF in data/factsheets/ or runs `jocari.cli add-nav`
#   myinvestor       DISABLED until MyInvestor confirms automated use through the connector

defaults:
  crosscheck: finect          # fund pages only; /doclegal and /document are disallowed by robots.txt
  crosscheck_tolerance_pct: 0.05
  myinvestor: disabled

instruments:
