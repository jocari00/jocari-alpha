# My own portfolio — its own page (about/portfolio/), reached only from a link on About.
# Same engine as the model portfolios (constant weights, reset to target at every valuation
# date; NAVs from the Drive "VL fondos" tab), but it does not follow the construction rules.
# It starts on its first weekly close after the commit (Friday 2026-11-06), so no figure is
# estimated; after that it is valued at every month end.
# Funds not in config/instruments.yaml are listed under extra_funds; routine 1 must record them.
portfolio: personal
name: My portfolio
start_date: 2026-11-06
equity_target: 75          # aggressive alternatives count as equity, as in the models
fixed_income_target: 25
benchmark:
  IE00B6R52259: 75     # iShares MSCI ACWI (Acc)
  IE00B3VTMJ91: 12.5   # iShares EUR Govt Bond 1-3yr (Acc)
  IE00BH04FZ00: 12.5   # Vanguard EUR Corporate 1-3 Year (Acc)
